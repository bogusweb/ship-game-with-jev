name: materialize-og-images
on:
  push:
    branches: [cursor/social-meta-og-8c6f]
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs when all chunks exist
        run: |
          set -euo pipefail
          en_dir=tmp/og-b64/en
          pl_dir=tmp/og-b64/pl
          if [ ! -f "$en_dir/c011" ] || [ ! -f "$pl_dir/c012" ]; then
            echo "chunks not ready yet"
            exit 0
          fi
          mkdir -p public
          cat $(ls "$en_dir"/c* | sort) | tr -d '\n' | base64 -d > public/og-image-en.jpg
          cat $(ls "$pl_dir"/c* | sort) | tr -d '\n' | base64 -d > public/og-image-pl.jpg
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              "public/og-image-en.jpg": 70591,
              "public/og-image-pl.jpg": 73486,
          }
          for path, size in checks.items():
              data = Path(path).read_bytes()
              assert data[:3] == b"\xff\xd8\xff", path
              assert len(data) == size, (path, len(data), size)
          PY
          rm -rf tmp .github/workflows/materialize-og-images.yml
          git config user.name "Pawel Boguslawski"
          git config user.email "bogusweb@users.noreply.github.com"
          git add public/og-image-en.jpg public/og-image-pl.jpg
          git add -u tmp .github/workflows/materialize-og-images.yml
          git commit -m "feat: add Open Graph and Twitter card images"
          git push
