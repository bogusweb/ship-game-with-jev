name: Commit hunt screenshots

on:
  push:
    branches: [cursor/jev-hunt-screenshots-405e]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'cursor/jev-hunt-screenshots-405e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/jev-hunt-screenshots-405e
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode WebP payloads into PNG screenshots
        run: |
          set -euo pipefail
          if [ -f docs/jev-hunt-after-autoplace.png ] && [ -f docs/jev-hunt-midgame-board.png ] && [ -f docs/jev-hunt-journal-jev-source.png ]; then
            echo "PNG screenshots already present"
            exit 0
          fi
          python3 -m pip install --user pillow
          python3 docs/decode-hunt-screenshots.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jev-hunt-after-autoplace.png docs/jev-hunt-midgame-board.png docs/jev-hunt-journal-jev-source.png
          git commit -m "Add hunt-mode verification screenshots"
          git push
